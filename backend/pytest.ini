[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: teste de unidade (IO-free, roda em memoria, sem tocar banco/rede)
    integration: teste de integracao (IO-dependent, sobe banco SQLite real via TestClient)
    e2e: teste ponta-a-ponta (fluxo completo via HTTP + banco, poucos e caros)
    mock: teste solitario que usa dublês/mocks para isolar a unidade do colaborador

addopts = -v --strict-markers
