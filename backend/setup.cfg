[mutmut]
# Teste de mutacao (Aula 9): mira so o "functional core" da aplicacao -
# services.py concentra toda a regra de negocio pura (sem I/O), entao e
# aqui que mutantes sobreviventes sao mais preocupantes (indicam lacuna
# logica, nao apenas lacuna de linha executada).
source_paths=
    services.py
pytest_add_cli_args_test_selection=
    tests/unit/
    tests/doubles/
